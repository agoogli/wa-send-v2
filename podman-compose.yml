services:
  db:
    image: docker.io/library/postgres:15-alpine
    container_name: wa-send-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ghcr.io/agoogli/wa-send-v2/wa-send-backend:latest
    container_name: wa-send-backend
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - db

  frontend:
    image: ghcr.io/agoogli/wa-send-v2/wa-send-frontend:latest
    container_name: wa-send-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: